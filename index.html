<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Explore Hub</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: linear-gradient(to bottom, #1a1a2e 0%, #16213e 100%);
      min-height: 100vh;
      padding: 20px;
      color: #e4e4e7;
    }

    header {
      max-width: 1200px;
      margin: 0 auto 4rem;
      padding: 2rem 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .logo {
      font-size: 1.8rem;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: -0.5px;
    }

    .container {
      max-width: 1200px;
      width: 100%;
      margin: 0 auto;
    }

    h1 {
      color: #ffffff;
      font-size: 3rem;
      margin-bottom: 1rem;
      font-weight: 700;
      letter-spacing: -1px;
    }

    .subtitle {
      color: #a1a1aa;
      font-size: 1.2rem;
      margin-bottom: 4rem;
      font-weight: 400;
    }

    .links-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 2rem;
    }

    .link-card {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 3rem;
      text-decoration: none;
      color: #e4e4e7;
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      overflow: hidden;
    }

    .link-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(135deg, rgba(100, 100, 150, 0.1) 0%, rgba(80, 80, 120, 0.1) 100%);
      opacity: 0;
      transition: opacity 0.4s ease;
    }

    .link-card:hover::before {
      opacity: 1;
    }

    .link-card:hover {
      transform: translateY(-8px);
      border-color: rgba(255, 255, 255, 0.2);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
    }

    .link-title {
      font-size: 1.8rem;
      font-weight: 600;
      margin-bottom: 1rem;
      color: #ffffff;
      position: relative;
      z-index: 1;
    }

    .link-description {
      color: #a1a1aa;
      line-height: 1.7;
      font-size: 1rem;
      position: relative;
      z-index: 1;
    }

    .arrow {
      display: inline-block;
      margin-left: 0.5rem;
      transition: transform 0.3s ease;
      opacity: 0.7;
    }

    .link-card:hover .arrow {
      transform: translateX(6px);
      opacity: 1;
    }

    @media (max-width: 768px) {
      h1 {
        font-size: 2.2rem;
      }

      .subtitle {
        font-size: 1rem;
      }

      .links-grid {
        grid-template-columns: 1fr;
      }

      .link-card {
        padding: 2rem;
      }
    }
  </style>
</head>

<body>
  <header>
    <div class="logo">Explore Hub</div>
  </header>

  <div class="container">
    <h1>Discover Sites</h1>
    <p class="subtitle">A collection of useful websites</p>

    <div class="links-grid">
      <a href="BIRDWATCHING_URL" class="link-card" target="_blank">
        <h2 class="link-title">Birdwatching Site <span class="arrow">→</span></h2>
        <p class="link-description">
          Explore the wonderful world of birds and discover species from around the globe.
        </p>
      </a>

      <a href="DOOR_SHOP_URL" class="link-card" target="_blank">
        <h2 class="link-title">Door Shop <span class="arrow">→</span></h2>
        <p class="link-description">
          Browse our collection of quality doors for your home or business.
        </p>
      </a>
    </div>
  </div>
</body>

</html>
